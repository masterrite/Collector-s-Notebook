name: Build
# Build Tauri bundles for Windows, macOS, and Linux.
#
# Trigger: ONLY when a version tag v* is pushed/created (e.g. v3.0.5, or a new
# release made on GitHub with a new tag). Builds all platforms and attaches the
# bundles to that tag's Release. Commits to main and PRs do not build.
#
# Prereq committed to the repo: src-tauri/icons/ (run `cargo tauri icon` once
# locally and commit) — the macOS/Windows bundlers require icon.icns/.ico.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_installer: Collectors-Notebook-windows-x86_64.msi
            asset_portable: Collectors-Notebook-windows-x86_64-portable.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: Collectors-Notebook-macos-arm64.dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: Collectors-Notebook-macos-x86_64.dmg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: Collectors-Notebook-linux-x86_64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # One command per line — no shell line-continuations, which YAML/GHA can
      # mangle into stray backslash args (that produced binstall's
      # "multiple packages" error).
      - name: Install tauri-cli
        run: |
          cargo binstall tauri-cli --version "^2" --locked --no-confirm || cargo install tauri-cli --version "^2" --locked
          cargo tauri --version

      - name: Build bundles (Windows / MSI)
        if: runner.os == 'Windows'
        run: cargo tauri build --target ${{ matrix.target }} --bundles msi

      # Retry up to 3 times: on GitHub's macOS runners, the dmg step
      # (bundle_dmg.sh → hdiutil) sometimes fails with "couldn't eject disk -
      # Resource busy" because the OS is still indexing the temporary disk
      # image. It's a runner hiccup, not a code problem. Retries are quick
      # because the compiled app is reused; only the bundling is redone.
      - name: Build bundles (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo tauri build --target ${{ matrix.target }}; then
              exit 0
            fi
            echo "::warning::Bundling failed (attempt $attempt of 3), retrying..."
            # clear any half-made dmg and mounted volumes before retrying
            rm -rf src-tauri/target/${{ matrix.target }}/release/bundle/dmg || true
            if [ "$RUNNER_OS" = "macOS" ]; then
              for v in /Volumes/*Notebook*; do [ -d "$v" ] && hdiutil detach "$v" -force || true; done
            fi
            sleep 15
          done
          exit 1

      - name: Stage (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Stage (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "dist/${{ matrix.asset }}"

      # The MSI filename contains an apostrophe ("Collector's Notebook_..."),
      # which broke a glob copy silently. Resolve via -LiteralPath and fail
      # loudly if nothing is found, so a silent miss can't pass as success.
      - name: Stage (Windows installer + portable exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msi = Get-ChildItem -LiteralPath "src-tauri/target/${{ matrix.target }}/release/bundle/msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "No MSI found in bundle/msi"; exit 1 }
          Copy-Item -LiteralPath $msi.FullName -Destination "dist/${{ matrix.asset_installer }}"
          $exe = "src-tauri/target/${{ matrix.target }}/release/collectors-notebook.exe"
          if (-not (Test-Path -LiteralPath $exe)) { Write-Error "Portable exe missing"; exit 1 }
          Copy-Item -LiteralPath $exe -Destination "dist/${{ matrix.asset_portable }}"
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
